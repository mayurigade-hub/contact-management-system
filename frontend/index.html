<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Management Application</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <div class="app-container">
            <header class="app-header">
                <div>
                    <h1>Contact Manager</h1>
                    <p class="subtitle">
                        Collaberative Network Directory
                    </p>
                </div> 
            <button id="add-contact-btn" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i>Add Contact
            </button>
            </header>

            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search by name, email or phone number...">
            </div>

            <!-- Section Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all"><i class="fa-solid fa-address-book"></i> All</button>
                <button class="filter-tab" data-filter="favorites"><i class="fa-solid fa-star"></i> Favorites</button>
                <button class="filter-tab" data-filter="Work"><i class="fa-solid fa-briefcase"></i> Work</button>
                <button class="filter-tab" data-filter="Family"><i class="fa-solid fa-house-user"></i> Family</button>
                <button class="filter-tab" data-filter="Friends"><i class="fa-solid fa-user-group"></i> Friends</button>
                <button class="filter-tab" data-filter="Other"><i class="fa-solid fa-tag"></i> Other</button>
            </div>

            <main id="contacts-grid" class="contacts-grid">
            </main>
        </div>

        <div id="contact-modal" class="modal-backdrop hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h3 id="modal-title">Add New Contacts</h3>
                    <button class="close-btn" id="close-modal-btn">&times;</button>
                </div>
                <form id="contact-form" novalidate>
                    <input type="hidden" id="contact-id">
                    <!--for Favorite-->
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label" for="contact-favorite">
                            <input type="checkbox" id="contact-favorite">
                            <span><i class="fa-solid fa-star star-icon"></i> Add to Favorites</span>
                        </label>
                    </div>
                <!--for Name-->
                    <div class="form-group">
                        <label for="contact-name">Full Name *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="contact-name" placeholder="Name" required>
                        </div>
                        <span class="error-msg" id="name-error"></span>
                    </div>
                <!--for phone number-->
                <div class="form-group">
                    <label for="contact-phone">Phone Number*</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text" id="contact-phone" placeholder="+1 234 567 890" required>
                    </div>
                    <span class="error-msg" id="phone-error"></span>
                </div>    
                <!--for email-->
                <div class="form-group">
                    <label for="contact-email">Email Address*</label>
                    <div  class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="text" id="contact-email" placeholder="abc@gmail.com" required>
                    </div>
                    <span class="error-msg" id="email-error"></span>
                </div>
                <!--for company-->
                <div class="form-group">
                    <label for="contact-company">Company(optional)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-briefcase"></i>
                        <input type="text" id="contact-company" placeholder="TCS">
                    </div>
                </div>
                <!--for category-->
                <div class="form-group">
                    <label for="contact-category">Tag / Category</label>
                    <div class="input-wrapper select-wrapper">
                        <i class="fa-solid fa-tag"></i>
                        <select id="contact-category">
                            <option value="">None</option>
                            <option value="Work">Work</option>
                            <option value="Family">Family</option>
                            <option value="Friends">Friends</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <!--for profile image-->
                <div class="form-group">
                    <label>Profile Photo (optional)</label>

                    <!-- Mode Toggle -->
                    <div class="image-mode-toggle">
                        <button type="button" class="img-mode-btn active" id="mode-file-btn">
                            <i class="fa-solid fa-upload"></i> Upload File
                        </button>
                        <button type="button" class="img-mode-btn" id="mode-url-btn">
                            <i class="fa-solid fa-link"></i> Paste URL
                        </button>
                    </div>

                    <!-- File Upload Drop Zone -->
                    <div id="file-input-wrapper" class="upload-drop-zone" id="upload-drop-zone">
                        <input type="file" id="contact-file" accept="image/*" class="file-input-hidden">
                        <i class="fa-solid fa-cloud-arrow-up upload-zone-icon"></i>
                        <p class="upload-zone-text">Click to choose a photo</p>
                        <p class="upload-zone-hint">JPG, PNG, WebP — auto-compressed</p>
                    </div>

                    <!-- URL Input -->
                    <div id="url-input-wrapper" class="input-wrapper hidden">
                        <i class="fa-solid fa-image"></i>
                        <input type="url" id="contact-image" placeholder="https://example.com/photo.jpg">
                    </div>

                    <!-- Preview -->
                    <div id="image-preview-wrapper" class="image-preview-wrapper hidden">
                        <img id="image-preview" src="" alt="Preview">
                        <div class="preview-info">
                            <span id="preview-label">Image Preview</span>
                            <small class="preview-sub">Ready to save</small>
                        </div>
                        <button type="button" id="remove-image-btn" class="remove-img-btn" title="Remove Image">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="save-contact-btn" class="btn btn-primary">Save Contact</button>
                </div>
                </form>
            </div>
        </div>
        <div id="toast-container" class="toast-container"></div>
        <script type="module" src="app.js"></script>
    </body>
</html>
